<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern CAN Monitor</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border: #333;
            --text: #e0e0e0;
            --accent: #4ec9b0;
            --header-bg: #252526;
            --input-bg: #2d2d2d;
            --idcolor: #d48d53;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg-color); 
            color: var(--text); 
            padding: 20px; 
        }

        /* --- Base Grid Elements --- */
        .header-cell, .data-cell {
            padding: 12px;
            background-color: var(--card-bg);
            display: flex;
            align-items: center;
        }

        .header-cell {
            font-weight: bold;
            background-color: var(--header-bg);
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.8rem;
            height: 16px; /* Fixed height for header consistency */
        }

        .data-cell { 
            font-family: 'Cascadia Code', monospace; 
            font-size: 0.9rem; 
            padding: 2px;
            padding-left: 4px;
        }

        .id-cell {
            color: var(--idcolor);
        }

        /* --- Specific Grid Layouts --- */
        .can-grid {
            display: grid;
            grid-template-columns: 0.75fr 0.5fr 4fr 0.5fr; /* Time, ID, Data, DLC */
            gap: 1px;
            background-color: var(--border);
            border: 1px solid var(--border);
            border-radius: 4px;
            height: 600px;
            overflow-y: auto;
        }

        /* Specific override for the Inventory/Editor */
        #editor-container {
            grid-template-columns: 0.3fr 0.3fr 2fr; 
            height: auto; /* Allow growth or set specific height */
        }

        .input-group {
            padding-left: 0px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 3fr 0.5fr;
            gap: 1px;
            background-color: var(--border);
            border: 1px solid var(--border);
            border-radius: 4px;
            height: 800px;
            overflow-y: auto;
        }

        .audit-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr 2fr 3fr; /* Time, Node, Field, Change, Comment */
            gap: 1px;
            background-color: var(--border);
            border: 1px solid var(--border);
            border-radius: 4px;
            height: 300px;
            overflow-y: auto;
        }

        /* --- Input Styles --- */
        .editor-input, .edit-input, .audit-input, .cell-input {
            background-color: var(--input-bg);
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 3px;
            padding: 2px;
            font-family: 'Cascadia Code', monospace;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        .config-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
        }

        .editor-input:focus, .cell-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .small-input {
            width: 50px !important;
            text-align: center;
        }

        /* --- Labels and Helpers --- */
        .label-row {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            font-size: 0.7rem;
            color: var(--accent);
            opacity: 0.7;
            padding-right: 20px;
            margin-top: 4px;
        }

        .label-text {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--accent);
            padding-right: 20px;
            gap: 12px;
        }

        .label-text-inside {
            padding-left: 20px;
        }

        .command-button {
            font-size: 0.7rem;
            font-family: Georgia, 'Times New Roman', Times, serif;
            letter-spacing: 0.12em;
        }

        /* --- CAN Specific Coloring --- */
        .hex-id { color: #ce9178; }
        .hex-data { color: #dcdcaa; }

        .range-switch  { background-color: #3d5a80 !important; } 
        .range-display { background-color: #4f6d7a !important; }
        .range-config  { background-color: #5f7d8a !important; }
        .range-data    { background-color: #6b5655 !important; }
        .range-intro   { background-color: #2f621f !important; }

        /* --- Buttons & Status --- */
        .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }

        button { 
            cursor: pointer; 
            background: var(--accent); 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            font-weight: bold; 
            color: #121212; /* Dark text on light accent */
        }

        .save-btn { background-color: #2ea043 !important; color: white !important; }

        /* --- Animations --- */
        @keyframes flash-green {
            0% { background-color: #2ea043; }
            100% { background-color: transparent; }
        }
        .flash-success { animation: flash-green 1.5s ease-out; }

    </style>
</head>
<body>
    <div class="controls">
        <div id="status">Status: Connecting...</div>
        <input type="text" id="filter-input" placeholder="Enter ID (e.g. 0x123)">
        <button onclick="toggleFilter()">Toggle Filter</button>
        <div id="active-filters"></div>
    </div>

    <h2>Module Editor</h2>
    <div class="can-grid" id="editor-container">
      
    </div>

    <span>&nbsp;</span>
    <h2>Audit Log</h2>
    <div class="audit-grid" id="audit-container">
        <div class="header-cell">Timestamp</div>
        <div class="header-cell">Node (Sub)</div>
        <div class="header-cell">Field</div>
        <div class="header-cell">Change</div>
        <div class="header-cell">Notes / Comments</div>
    </div>

    <span>&nbsp;</span>
    <h2>CAN Live Feed</h2>
    <div class="can-grid" id="can-container">
        <div class="header-cell">Timestamp</div>
        <div class="header-cell">ID (Hex)</div>
        <div class="header-cell">Data (Payload)</div>
        <div class="header-cell">DLC</div>
        
    </div>
    <script src="client.js"></script>

</body>
</html>
